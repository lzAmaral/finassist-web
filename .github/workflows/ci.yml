name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finassist
          POSTGRES_PASSWORD: finassist
          POSTGRES_DB: finassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finassist" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://finassist:finassist@localhost:5432/finassist?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Formatação
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Migrations
        run: for f in migrations/*.sql; do PGPASSWORD=finassist psql -q -v ON_ERROR_STOP=1 -h localhost -U finassist -d finassist -f "$f"; done
      - name: Testes (com banco)
        # Os testes de banco compartilham fixtures entre pacotes; a ponte web usa Node 24.
        run: go test -p 1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npx vitest run
      - run: npm run build
